name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Ensure GitHub Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          create_response=$(mktemp)
          create_status=$(curl -sS -o "$create_response" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$create_status" != "201" ] && [ "$create_status" != "409" ]; then
            cat "$create_response"
            exit 1
          fi

          status_response=$(mktemp)
          pages_status=""
          for _ in 1 2 3 4 5; do
            pages_status=$(curl -sS -o "$status_response" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages")
            if [ "$pages_status" = "200" ]; then
              break
            fi
            sleep 3
          done

          if [ "$pages_status" != "200" ]; then
            cat "$status_response"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
